<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Configurar contraseña · Foro CMS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#052447,#075379);font:16px system-ui,Arial,sans-serif;display:grid;place-items:center;padding:24px;color:#082949}.card{width:min(440px,100%);background:white;border-radius:18px;padding:32px;box-shadow:0 15px 55px #001c3240}h1{font-size:25px;margin:0 0 12px}p{line-height:1.5;color:#426079}label{display:block;margin:18px 0 8px;font-size:14px;font-weight:700}input{width:100%;padding:13px;border:1px solid #b8c9d5;border-radius:8px;font-size:16px}button{display:block;width:100%;background:#063463;color:white;padding:14px;border:0;border-radius:8px;margin-top:18px;cursor:pointer;font-weight:700}button:disabled{opacity:.5}a{display:block;text-align:center;margin-top:18px;color:#064e87}#status{min-height:22px}small{color:#5b6d80}</style></head><body><main class="card"><h1>Acceso al Foro</h1><p id="intro">Estamos verificando el enlace de invitación o recuperación.</p><form id="form" hidden><label for="password">Nueva contraseña</label><input type="password" id="password" autocomplete="new-password" minlength="10" required><label for="confirm">Repetir contraseña</label><input type="password" id="confirm" autocomplete="new-password" minlength="10" required><small>Mínimo 10 caracteres. Elegí una contraseña exclusiva para esta cuenta.</small><button id="submit" type="submit">Guardar contraseña</button></form><p id="status" role="status"></p><a href="./">Ir al inicio de sesión</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/db.js"></script><script src="acceso.js"></script></body></html>
